<!--
  markdown.html —— md 命令的出图模板

  body 是 markdownToHtml 的产物（已是转义安全的 HTML），故用 {{@body}} 原样注入。
  样式走浅色 GitHub 风：宽度固定，正文舒展，代码块 / 表格 / 引用各有辨识度。
-->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f8fa; }
    #container {
      width: 860px;
      margin: 0 auto;
      background: #ffffff;
      padding: 44px 48px;
      color: #1f2328;
      font-size: 16px;
      line-height: 1.7;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      word-wrap: break-word;
    }
    .md > :first-child { margin-top: 0; }
    .md > :last-child { margin-bottom: 0; }
    h1, h2, h3, h4, h5, h6 { margin: 26px 0 16px; font-weight: 600; line-height: 1.3; }
    h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid #d1d9e0; }
    h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid #d1d9e0; }
    h3 { font-size: 1.25em; }
    h4 { font-size: 1em; }
    h5 { font-size: .875em; }
    h6 { font-size: .85em; color: #59636e; }
    p { margin: 0 0 16px; }
    a { color: #0969da; text-decoration: none; }
    a:hover { text-decoration: underline; }
    ul, ol { margin: 0 0 16px; padding-left: 2em; }
    li { margin: 4px 0; }
    blockquote {
      margin: 0 0 16px;
      padding: 0 1em;
      color: #59636e;
      border-left: .25em solid #d1d9e0;
    }
    blockquote > :last-child { margin-bottom: 0; }
    hr { height: 1px; margin: 24px 0; background: #d1d9e0; border: 0; }
    code {
      font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
      font-size: 85%;
      background: rgba(129, 139, 152, .12);
      padding: .2em .4em;
      border-radius: 6px;
    }
    pre {
      margin: 0 0 16px;
      padding: 16px;
      overflow: auto;
      background: #f6f8fa;
      border-radius: 8px;
      line-height: 1.45;
    }
    pre code {
      background: transparent;
      padding: 0;
      font-size: 85%;
      white-space: pre;
    }
    img { max-width: 100%; box-sizing: border-box; }
    table {
      border-collapse: collapse;
      margin: 0 0 16px;
      display: block;
      width: max-content;
      max-width: 100%;
      overflow: auto;
    }
    th, td { padding: 6px 13px; border: 1px solid #d1d9e0; }
    th { font-weight: 600; background: #f6f8fa; }
    tr:nth-child(2n) { background: #f6f8fa; }
    del { color: #59636e; }
    strong { font-weight: 600; }
  </style>
</head>
<body>
  <div id="container">
    <div class="md">{{@body}}</div>
  </div>
</body>
</html>
